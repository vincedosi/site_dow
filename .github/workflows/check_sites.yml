name: Check Sites

on:
  schedule:
    - cron: '*/30 * * * *' # Tourne toutes les 30 min
  workflow_dispatch: # Permet de lancer manuellement

permissions:
  contents: write # Nécessaire pour sauvegarder le fichier JSON

jobs:
  check-and-alert:
    runs-on: ubuntu-24.04 # Version fixée pour éviter les surprises de ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le script de surveillance
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: python monitor.py

      - name: Sauvegarder le résultat
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mise à jour état des sites"
          file_pattern: "etat_sites.json"
